<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Super Meet Bros. | Secret level</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/thumbs/avatar.webp" type="image/webp">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #05060A; color: #EDEDF0; font-family: "Press Start 2P", monospace; overflow: hidden; touch-action: none; }
    #game { position: absolute; inset: 0; margin: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
    .back { position: fixed; top: 12px; left: 12px; z-index: 5; font-size: 10px; color: #7CC0FF; text-decoration: none; padding: 9px 12px; border: 2px solid #23406E; background: #0F1A2E; }
    .back:hover { background: #16274a; }
    .help { position: fixed; top: 12px; right: 12px; z-index: 5; font-size: 9px; line-height: 1.8; color: #9A9AA4; text-align: right; }
    .pad { position: fixed; bottom: 18px; z-index: 5; display: none; gap: 14px; }
    .pad.left { left: 18px; } .pad.right { right: 18px; }
    .pad button { width: 64px; height: 64px; border-radius: 50%; border: 2px solid #33333B; background: rgba(20, 20, 26, .75); color: #fff; font: 16px "Press Start 2P", monospace; touch-action: none; }
    .pad button.big { width: 78px; height: 78px; background: rgba(47, 140, 255, .35); border-color: #2F8CFF; }
    @media (pointer: coarse) { .pad { display: flex; } .help { display: none; } }
  </style>
</head>
<body>
  <a class="back" href="./">← Back to portfolio</a>
  <p class="help">← → move · Shift run<br>Space / ↑ jump · P pause</p>
  <canvas id="game" aria-label="Super Meet Bros. platformer game"></canvas>
  <div class="pad left"><button data-k="left" aria-label="Left">◀</button><button data-k="right" aria-label="Right">▶</button></div>
  <div class="pad right"><button data-k="run" aria-label="Run">B</button><button class="big" data-k="jump" aria-label="Jump">A</button></div>

<script>
// Super Meet Bros.: an original platformer homage. All art and sounds are drawn in code.
const T = 16, VW = 400, VH = 224, ROWS = 14;
const cv = document.getElementById("game"), g = cv.getContext("2d");
function fit() {
  const s = Math.max(1, Math.floor(Math.min(innerWidth / VW, innerHeight / VH)));
  const scale = Math.min(innerWidth / VW, innerHeight / VH) < 1 ? Math.min(innerWidth / VW, innerHeight / VH) : s;
  cv.width = VW; cv.height = VH;
  cv.style.width = VW * scale + "px"; cv.style.height = VH * scale + "px";
  g.imageSmoothingEnabled = false;
}
addEventListener("resize", fit); fit();

/* ---------------- Level ---------------- */
const COLS = 212;
let map, coinsLeft;
function buildLevel() {
  map = Array.from({ length: ROWS }, () => Array(COLS).fill("."));
  const set = (x, y, c) => { if (x >= 0 && x < COLS && y >= 0 && y < ROWS) map[y][x] = c; };
  const gaps = [[69, 71], [86, 89], [153, 154]];
  for (let x = 0; x < COLS; x++) if (!gaps.some(([a, b]) => x >= a && x <= b)) { set(x, 12, "#"); set(x, 13, "#"); }
  const blocks = [[16, 8, "?"], [20, 8, "B"], [21, 8, "?"], [22, 8, "B"], [23, 8, "?"], [24, 8, "B"], [22, 4, "?"],
    [77, 8, "B"], [78, 8, "?"], [79, 8, "B"], [80, 4, "B"], [81, 4, "B"], [82, 4, "B"], [83, 4, "B"], [84, 4, "?"],
    [94, 8, "?"], [100, 8, "B"], [101, 8, "B"], [106, 8, "?"], [109, 8, "?"], [109, 4, "?"], [112, 8, "?"],
    [118, 8, "B"], [121, 4, "B"], [122, 4, "B"], [123, 4, "B"], [128, 4, "B"], [129, 4, "?"], [130, 4, "?"], [131, 4, "B"], [129, 8, "B"], [130, 8, "B"],
    [168, 8, "B"], [169, 8, "B"], [170, 8, "?"], [171, 8, "B"]];
  blocks.forEach(([x, y, c]) => set(x, y, c));
  const pipe = (x, h) => { for (let y = 12 - h; y < 12; y++) { set(x, y, y === 12 - h ? "[" : "{"); set(x + 1, y, y === 12 - h ? "]" : "}"); } };
  pipe(28, 2); pipe(38, 3); pipe(46, 4); pipe(57, 4); pipe(163, 2); pipe(179, 2);
  const stairs = (x, n, up) => { for (let i = 0; i < n; i++) for (let h = 0; h <= i; h++) set(up ? x + i : x + n - 1 - i, 11 - h, "="); };
  stairs(134, 4, true); stairs(140, 4, false); stairs(148, 5, true); set(152, 11, "="); set(152, 10, "="); set(152, 9, "="); set(152, 8, "=");
  stairs(155, 4, false); stairs(181, 8, true); for (let h = 0; h < 8; h++) set(189, 11 - h, "=");
  for (let y = 2; y < 12; y++) set(198, y, "|"); set(198, 1, "o"); set(198, 11, "=");
  [[35, 6], [36, 6], [60, 7], [61, 7], [62, 7], [91, 9], [92, 9], [114, 6], [115, 6], [144, 9], [145, 9], [174, 7], [175, 7]].forEach(([x, y]) => set(x, y, "c"));
  coinsLeft = 0;
}
const SOLID = new Set(["#", "B", "?", "u", "=", "[", "]", "{", "}"]);
const tile = (x, y) => (x < 0 || x >= COLS || y >= ROWS ? "#" : y < 0 ? "." : map[y][x]);
const solidAt = (px, py) => SOLID.has(tile(Math.floor(px / T), Math.floor(py / T)));

/* ---------------- Sound (tiny original square-wave effects) ---------------- */
let actx;
function beep(notes, type = "square", vol = 0.06) {
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    let t = actx.currentTime;
    notes.forEach(([f, d]) => {
      const o = actx.createOscillator(), v = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(v).connect(actx.destination); o.start(t); o.stop(t + d);
      t += d * 0.85;
    });
  } catch (e) {}
}
const SFX = {
  jump: () => beep([[330, 0.06], [520, 0.09]]),
  coin: () => beep([[988, 0.06], [1319, 0.16]]),
  stomp: () => beep([[220, 0.05], [140, 0.1]], "triangle", 0.12),
  bump: () => beep([[160, 0.07]], "triangle", 0.1),
  brick: () => beep([[300, 0.04], [180, 0.05], [90, 0.08]], "sawtooth", 0.05),
  die: () => beep([[494, 0.12], [392, 0.12], [330, 0.12], [262, 0.3]], "square", 0.07),
  win: () => beep([[523, 0.1], [659, 0.1], [784, 0.1], [1047, 0.25], [784, 0.1], [1047, 0.4]]),
};

/* ---------------- Entities ---------------- */
let P, enemies, effects, cam, score, coins, lives, time, state, flagY, checkpoint;
function spawnEnemies() {
  enemies = [22, 40, 51, 53, 80, 82, 97, 99, 114, 116, 125, 129, 174, 176].map((x) => ({ x: x * T, y: 11 * T, vx: -0.55, vy: 0, w: 14, h: 14, alive: true, squash: 0, active: false }));
}
function resetPlayer(x) { P = { x: (x || 3) * T, y: 10 * T, vx: 0, vy: 0, w: 12, h: 15, onGround: false, face: 1, anim: 0, dead: 0, inv: 0 }; }
function newGame() {
  buildLevel(); spawnEnemies(); effects = []; score = 0; coins = 0; lives = 3; checkpoint = 3; time = 300;
  resetPlayer(); cam = 0; flagY = 1.5 * T; state = "title";
}
newGame();

/* ---------------- Input ---------------- */
const keys = {};
const map_ = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", ArrowUp: "jump", KeyW: "jump", Space: "jump", KeyZ: "jump", ShiftLeft: "run", ShiftRight: "run", KeyX: "run" };
addEventListener("keydown", (e) => {
  if (map_[e.code]) { keys[map_[e.code]] = true; e.preventDefault(); }
  if (e.code === "KeyP" && state === "play") state = "pause"; else if (e.code === "KeyP" && state === "pause") state = "play";
  if ((e.code === "Enter" || e.code === "Space") && (state === "title" || state === "over" || state === "won")) start();
});
addEventListener("keyup", (e) => { if (map_[e.code]) keys[map_[e.code]] = false; });
document.querySelectorAll(".pad button").forEach((b) => {
  const k = b.dataset.k;
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); keys[k] = true; if (state !== "play" && state !== "pause") start(); });
  ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => b.addEventListener(ev, () => { keys[k] = false; }));
});
cv.addEventListener("pointerdown", () => { if (state === "title" || state === "over" || state === "won") start(); });
function start() { if (state === "over" || state === "won") newGame(); state = "play"; SFX.coin(); }

/* ---------------- Physics ---------------- */
function moveX(o, dx) {
  o.x += dx;
  const top = o.y + 1, bot = o.y + o.h - 1;
  if (dx > 0 && (solidAt(o.x + o.w, top) || solidAt(o.x + o.w, bot) || solidAt(o.x + o.w, o.y + o.h / 2))) { o.x = Math.floor((o.x + o.w) / T) * T - o.w - 0.01; return true; }
  if (dx < 0 && (solidAt(o.x, top) || solidAt(o.x, bot) || solidAt(o.x, o.y + o.h / 2))) { o.x = Math.floor(o.x / T + 1) * T + 0.01; return true; }
  return false;
}
function moveY(o, dy, onHead) {
  o.y += dy; o.onGround = false;
  const l = o.x + 1, r = o.x + o.w - 1;
  if (dy > 0 && (solidAt(l, o.y + o.h) || solidAt(r, o.y + o.h))) { o.y = Math.floor((o.y + o.h) / T) * T - o.h; o.vy = 0; o.onGround = true; }
  else if (dy < 0 && (solidAt(l, o.y) || solidAt(r, o.y))) {
    const ty = Math.floor(o.y / T), mid = Math.floor((o.x + o.w / 2) / T);
    const hx = SOLID.has(tile(mid, ty)) ? mid : SOLID.has(tile(Math.floor(l / T), ty)) ? Math.floor(l / T) : Math.floor(r / T);
    o.y = (ty + 1) * T; o.vy = 0.5;
    onHead && onHead(hx, ty);
  }
}
function hitBlock(tx, ty) {
  const t = tile(tx, ty);
  if (t === "?") {
    map[ty][tx] = "u"; coins++; score += 200; SFX.coin();
    effects.push({ type: "coin", x: tx * T + 4, y: ty * T - 8, vy: -4, life: 30 });
    effects.push({ type: "bump", tx, ty, life: 8 });
  } else if (t === "B") {
    map[ty][tx] = "."; score += 50; SFX.brick();
    for (let i = 0; i < 4; i++) effects.push({ type: "chunk", x: tx * T + 8, y: ty * T + 8, vx: (i % 2 ? 1.6 : -1.6), vy: i < 2 ? -6 : -4, life: 60 });
  } else SFX.bump();
  // knock out enemies standing on the block
  enemies.forEach((en) => { if (en.alive && Math.abs(en.x + 7 - (tx * T + 8)) < 14 && Math.abs(en.y + en.h - ty * T) < 3) killEnemy(en, true); });
}
function killEnemy(en, flip) {
  en.alive = false; en.squash = flip ? -1 : 30; score += 200;
  effects.push({ type: "text", text: "200", x: en.x, y: en.y - 4, life: 40 });
  if (flip) { en.vy = -4; en.flip = true; }
}
function die() {
  if (P.dead) return;
  P.dead = 1; P.vy = -7; SFX.die(); lives--;
}

/* ---------------- Update ---------------- */
let frames = 0;
function update() {
  frames++;
  effects = effects.filter((f) => {
    f.life--;
    if (f.type === "coin") { f.y += f.vy; f.vy += 0.3; }
    if (f.type === "chunk") { f.x += f.vx; f.y += f.vy; f.vy += 0.35; }
    if (f.type === "text") f.y -= 0.5;
    return f.life > 0;
  });
  if (state !== "play") return;
  if (frames % 60 === 0 && !P.dead && !P.flag) { time--; if (time <= 0) die(); }

  if (P.dead) {
    P.vy += 0.4; P.y += P.vy; P.dead++;
    if (P.dead > 120) {
      if (lives <= 0) { state = "over"; return; }
      resetPlayer(checkpoint); spawnEnemies(); time = 300; cam = Math.max(0, P.x - 120);
    }
    return;
  }
  if (P.flag) {  // slide down the pole, then walk off
    if (P.y + P.h < 11 * T) { P.y += 2; flagY = Math.min(flagY + 2, 10 * T); }
    else { P.face = 1; P.x += 1; P.anim += 0.2; if (P.x > 205 * T) { state = "won"; score += time * 10; time = 0; } }
    return;
  }

  const run = keys.run ? 1.6 : 1, max = 2.1 * run;
  if (keys.left) { P.vx = Math.max(P.vx - 0.22, -max); P.face = -1; }
  else if (keys.right) { P.vx = Math.min(P.vx + 0.22, max); P.face = 1; }
  else P.vx *= P.onGround ? 0.78 : 0.95;
  if (Math.abs(P.vx) < 0.05) P.vx = 0;
  if (keys.jump && P.onGround && !P.jumpHeld) { P.vy = -7.2 - Math.abs(P.vx) * 0.25; SFX.jump(); P.jumpHeld = true; }
  if (!keys.jump) P.jumpHeld = false;
  P.vy += keys.jump && P.vy < 0 ? 0.28 : 0.55;
  P.vy = Math.min(P.vy, 8);
  moveX(P, P.vx);
  if (P.x < cam) { P.x = cam; P.vx = 0; }
  moveY(P, P.vy, hitBlock);
  P.anim += P.onGround ? Math.abs(P.vx) * 0.12 : 0;
  if (P.y > VH + 20) { die(); return; }
  if (P.inv > 0) P.inv--;
  if (P.x > 100 * T && checkpoint < 100) checkpoint = 100;

  // coins
  const cx = Math.floor((P.x + P.w / 2) / T), cyT = Math.floor(P.y / T), cyB = Math.floor((P.y + P.h - 1) / T);
  [cyT, cyB].forEach((cy) => { if (tile(cx, cy) === "c") { map[cy][cx] = "."; coins++; score += 100; SFX.coin(); } });
  if (coins >= 100) { coins -= 100; lives++; effects.push({ type: "text", text: "1UP", x: P.x, y: P.y - 8, life: 50 }); }

  // flagpole
  if (P.x + P.w >= 198 * T - 1) {   // touching the pole or its base block
    P.flag = true; P.x = 198 * T - 6; P.vx = 0; P.vy = 0;
    const bonus = Math.max(100, Math.round((11 * T - P.y) / T) * 400);
    score += bonus; effects.push({ type: "text", text: String(bonus), x: P.x + 12, y: P.y, life: 80 }); SFX.win();
  }

  // enemies
  enemies.forEach((en) => {
    if (!en.active && en.x < cam + VW + 32) en.active = true;
    if (!en.active) return;
    if (!en.alive) { if (en.flip) { en.vy += 0.4; en.y += en.vy; } else en.squash--; return; }
    en.vy = Math.min(en.vy + 0.5, 8);
    if (moveX(en, en.vx)) en.vx *= -1;
    moveY(en, en.vy);
    if (en.y > VH + 40) en.alive = false;
    // player contact
    if (P.x < en.x + en.w && P.x + P.w > en.x && P.y < en.y + en.h && P.y + P.h > en.y) {
      if (P.vy > 0 && P.y + P.h - en.y < 9) { killEnemy(en, false); P.vy = keys.jump ? -7 : -4.5; SFX.stomp(); }
      else if (!P.inv) die();
    }
  });
  enemies.forEach((a) => enemies.forEach((b) => { if (a !== b && a.alive && b.alive && a.active && b.active && Math.abs(a.x - b.x) < 14 && Math.abs(a.y - b.y) < 8 && a.x < b.x && a.vx > 0) { a.vx *= -1; b.vx *= -1; } }));

  cam = Math.max(cam, Math.min(P.x - 150, COLS * T - VW));
}

/* ---------------- Drawing (all original pixel art) ---------------- */
const C = { sky1: "#0B1024", sky2: "#18204A", hill: "#141B3A", hill2: "#1C2650", ground: "#6B3F23", groundTop: "#2F8F5B", brick: "#9C5530", mortar: "#5A2E17", q: "#F2B53A", qDark: "#B07818", used: "#5B4636", pipe: "#2F9E8F", pipeDark: "#1F6E63", pipeLight: "#7FE0D2", stair: "#8A6A4A", pole: "#C9CDD6", flag: "#A66CFF", coin: "#FFD34E" };
const stars = Array.from({ length: 70 }, () => ({ x: Math.random() * 2000, y: Math.random() * 120, s: Math.random() < 0.15 ? 2 : 1 }));
function rect(x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); }

function drawBackground() {
  const sky = g.createLinearGradient(0, 0, 0, VH);
  sky.addColorStop(0, C.sky1); sky.addColorStop(1, C.sky2);
  g.fillStyle = sky; g.fillRect(0, 0, VW, VH);
  stars.forEach((s) => rect((s.x - cam * 0.1) % 2000 < 0 ? 0 : (s.x - cam * 0.1) % 420, s.y, s.s, s.s, frames % 90 < 3 && s.s === 2 ? "#fff" : "#9BB4E8"));
  g.fillStyle = "#E8E4C8"; g.beginPath(); g.arc(292, 52, 9, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#0E1430"; g.beginPath(); g.arc(297, 48, 8, 0, Math.PI * 2); g.fill();   // crescent moon
  for (let i = -1; i < 5; i++) {   // far hills
    const x = i * 160 - (cam * 0.25) % 160;
    g.fillStyle = C.hill; g.beginPath(); g.moveTo(x, 192); g.quadraticCurveTo(x + 60, 120, x + 140, 192); g.fill();
  }
  for (let i = -1; i < 6; i++) {   // near hills
    const x = i * 120 - (cam * 0.5) % 120;
    g.fillStyle = C.hill2; g.beginPath(); g.moveTo(x, 192); g.quadraticCurveTo(x + 40, 150, x + 90, 192); g.fill();
  }
}

function drawTile(t, x, y, tx, ty) {
  const bump = effects.find((f) => f.type === "bump" && f.tx === tx && f.ty === ty);
  if (bump) y -= Math.sin((bump.life / 8) * Math.PI) * 4;
  switch (t) {
    case "#":
      rect(x, y, T, T, C.ground);
      if (tile(tx, ty - 1) !== "#") { rect(x, y, T, 4, C.groundTop); rect(x + 3, y + 4, 2, 2, C.groundTop); rect(x + 11, y + 4, 2, 1, C.groundTop); }
      rect(x + 4, y + 9, 2, 2, "#56321C"); rect(x + 11, y + 12, 2, 2, "#56321C"); break;
    case "B":
      rect(x, y, T, T, C.brick); rect(x, y + 7, T, 1, C.mortar); rect(x, y + 15, T, 1, C.mortar);
      rect(x + 7, y, 1, 7, C.mortar); rect(x + 3, y + 8, 1, 7, C.mortar); rect(x + 12, y + 8, 1, 7, C.mortar); break;
    case "?": {
      const glow = Math.sin(frames * 0.1) > 0 ? C.q : "#FFD27A";
      rect(x, y, T, T, C.qDark); rect(x + 1, y + 1, T - 2, T - 2, glow);
      g.fillStyle = C.qDark; g.font = "10px 'Press Start 2P'"; g.fillText("?", x + 4, y + 13); break;
    }
    case "u": rect(x, y, T, T, "#3B2D22"); rect(x + 1, y + 1, T - 2, T - 2, C.used); break;
    case "=": rect(x, y, T, T, C.stair); rect(x, y, T, 2, "#B08A62"); rect(x, y, 2, T, "#B08A62"); rect(x + 14, y, 2, T, "#5E4630"); rect(x, y + 14, T, 2, "#5E4630"); break;
    case "[": case "]": {
      const left = t === "[";
      rect(left ? x - 2 : x, y, T + 2, 8, C.pipeDark); rect(left ? x : x, y + 1, T, 6, C.pipe);
      if (left) rect(x + 2, y + 1, 3, 6, C.pipeLight); break;
    }
    case "{": case "}": {
      const left = t === "{";
      rect(x, y, T, T, C.pipe); if (left) { rect(x + 3, y, 3, T, C.pipeLight); rect(x, y, 1, T, C.pipeDark); } else rect(x + 14, y, 2, T, C.pipeDark); break;
    }
    case "c": {
      const w = [6, 4, 2, 4][Math.floor(frames / 8) % 4];
      rect(x + 8 - w / 2, y + 3, w, 10, C.coin); rect(x + 8 - w / 2, y + 3, 1, 10, "#FFF2B0"); break;
    }
    case "|": rect(x + 7, y, 2, T, C.pole); break;
    case "o": rect(x + 5, y + 6, 6, 6, "#4ADE80"); rect(x + 7, y + 12, 2, 4, C.pole); break;
  }
}

function drawPlayer() {
  if (P.inv && frames % 6 < 3) return;
  const x = Math.round(P.x - cam), y = Math.round(P.y), f = P.face;
  const step = P.onGround ? Math.floor(P.anim) % 3 : 3;
  const flip = (dx, w) => (f > 0 ? x + dx : x + P.w - dx - w);
  // original "coder" hero: blue cap with headphones, purple hoodie, dark jeans
  rect(flip(1, 10), y, 10, 3, "#2F8CFF"); rect(flip(f > 0 ? 7 : 7, 6), y + 2, 6, 2, "#2F8CFF");   // cap + visor
  rect(flip(2, 8), y + 3, 8, 5, "#F1C27D");                                                       // face
  rect(flip(7, 1), y + 4, 1, 2, "#111");                                                          // eye
  rect(flip(0, 2), y + 2, 2, 5, "#111"); rect(flip(1, 1), y + 1, 1, 2, "#111");                   // headphones
  rect(flip(1, 10), y + 8, 10, 5, "#A66CFF"); rect(flip(4, 3), y + 9, 3, 3, "#7A4CE0");          // hoodie + pocket
  const arm = step === 3 ? -2 : step === 1 ? 1 : 0;
  rect(flip(f > 0 ? 9 : 9, 2), y + 9 + arm, 2, 3, "#F1C27D");
  const legA = [0, 2, -1, 1][step], legB = [0, -1, 2, -1][step];
  rect(flip(2, 3), y + 13, 3, 2 + Math.max(0, legA), "#23406E"); rect(flip(7, 3), y + 13, 3, 2 + Math.max(0, legB), "#23406E");
  rect(flip(1 + Math.max(0, legA), 4), y + 15, 4, 1, "#111"); rect(flip(6 + Math.max(0, legB), 4), y + 15, 4, 1, "#111");
}

function drawEnemy(en) {
  const x = Math.round(en.x - cam), y = Math.round(en.y);
  if (en.flip) { rect(x + 2, y + 6, 10, 6, "#4ADE80"); return; }
  if (!en.alive) { if (en.squash > 0) { rect(x, y + 10, 14, 4, "#2F8F5B"); rect(x + 3, y + 10, 2, 2, "#fff"); rect(x + 9, y + 10, 2, 2, "#fff"); } return; }
  const w = Math.floor(frames / 10) % 2;
  rect(x + 1, y + 3, 12, 8, "#2F8F5B"); rect(x + 3, y + 1, 8, 3, "#3FB070");          // bug shell
  rect(x + 6, y + 2, 2, 9, "#1E5A3A");                                                  // shell split
  rect(x + 2, y + 5, 3, 3, "#fff"); rect(x + 9, y + 5, 3, 3, "#fff"); rect(x + 3 + (en.vx > 0 ? 1 : 0), y + 6, 1, 2, "#111"); rect(x + 10 + (en.vx > 0 ? 1 : 0), y + 6, 1, 2, "#111");
  rect(x + 1, y + 11, 2, 3 - w, "#111"); rect(x + 6, y + 11, 2, 2 + w, "#111"); rect(x + 11, y + 11, 2, 3 - w, "#111");
  rect(x + 3, y - 1, 1, 2, "#111"); rect(x + 10, y - 1, 1, 2, "#111");                  // antennae
}

function text(s, x, y, size = 8, color = "#fff", align = "left") {
  g.font = `${size}px 'Press Start 2P'`; g.textAlign = align; g.fillStyle = "#000"; g.fillText(s, x + 1, y + 1); g.fillStyle = color; g.fillText(s, x, y); g.textAlign = "left";
}

function draw() {
  drawBackground();
  const c0 = Math.floor(cam / T), c1 = c0 + Math.ceil(VW / T) + 1;
  for (let ty = 0; ty < ROWS; ty++) for (let tx = c0; tx <= c1; tx++) { const t = tile(tx, ty); if (t !== ".") drawTile(t, tx * T - cam, ty * T, tx, ty); }
  // flag
  rect(198 * T - cam - 12, flagY, 12, 9, C.flag); rect(198 * T - cam - 9, flagY + 3, 4, 3, "#fff");
  // castle-ish finish gate
  const gx = 202 * T - cam;
  rect(gx, 8 * T, 4 * T, 4 * T, "#2A2F55"); rect(gx + 24, 10 * T, 16, 2 * T, "#0B1024"); for (let i = 0; i < 4; i++) rect(gx + i * 16, 7 * T + 8, 10, 8, "#2A2F55");
  text("EXIT", gx + 16, 9 * T + 4, 6, "#7CC0FF");
  enemies.forEach((en) => en.active && drawEnemy(en));
  effects.forEach((f) => {
    if (f.type === "coin") rect(f.x - cam, f.y, 6, 10, C.coin);
    if (f.type === "chunk") rect(f.x - cam, f.y, 5, 5, C.brick);
    if (f.type === "text") text(f.text, f.x - cam, f.y, 6, "#fff");
  });
  if (state !== "title") drawPlayer();
  // HUD
  text("SCORE", 12, 16, 7, "#9A9AA4"); text(String(score).padStart(6, "0"), 12, 27, 8);
  text("COINS", 112, 16, 7, "#9A9AA4"); text("x" + String(coins).padStart(2, "0"), 112, 27, 8, C.coin);
  text("LIVES", 200, 16, 7, "#9A9AA4"); text("x" + lives, 200, 27, 8, "#A66CFF");
  text("TIME", 330, 16, 7, "#9A9AA4"); text(String(time), 330, 27, 8);

  if (state === "title") panel("SUPER MEET BROS.", ["You found the secret level!", "", "Press Enter or tap to start"]);
  if (state === "pause") panel("PAUSED", ["Press P to continue"]);
  if (state === "over") panel("GAME OVER", ["Score " + score, "", "Press Enter or tap to retry"]);
  if (state === "won") panel("LEVEL CLEAR!", ["Score " + score, "Coins " + coins, "", "Thanks for playing!", "Now go hire Meet :)", "", "Enter or tap to play again"]);
}
function panel(title, lines) {
  const h = 40 + lines.length * 13;
  g.fillStyle = "rgba(5,6,10,.82)"; g.fillRect(VW / 2 - 150, VH / 2 - h / 2 - 6, 300, h + 12);
  g.strokeStyle = "#2F8CFF"; g.lineWidth = 2; g.strokeRect(VW / 2 - 150, VH / 2 - h / 2 - 6, 300, h + 12);
  text(title, VW / 2, VH / 2 - h / 2 + 20, 12, "#7CC0FF", "center");
  lines.forEach((l, i) => text(l, VW / 2, VH / 2 - h / 2 + 44 + i * 13, 7, "#EDEDF0", "center"));
}

(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
